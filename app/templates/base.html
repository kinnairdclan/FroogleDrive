<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FroogleDrive{% endblock %}</title>
  {# Keep htmx compatible with the CSP: no eval, no inline <style> or <script> #}
  <meta name="htmx-config" content='{"allowEval": false, "allowScriptTags": false, "includeIndicatorStyles": false}'>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <script src="{{ url_for('static', filename='htmx.min.js') }}" defer></script>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token() }}"}'>
  <header class="topbar">
    {% set brand_text %}FroogleDrive
      {%- if brand_subtitle %} <span class="brand-subtitle">({{ brand_subtitle }})</span>{% endif %}{% endset %}
    {# Public share pages show only the name: no links into the logged-in app #}
    {% if public %}
    <span class="brand">{{ brand_text }}</span>
    {% else %}
    <a class="brand" href="{{ url_for('browse.index') }}">{{ brand_text }}</a>
    {% endif %}
    {% if session.user and not public %}
    <nav>
      <a href="{{ url_for('browse.browse') }}">Files</a>
      <a href="{{ url_for('shares.index') }}">Shares</a>
      <form method="post" action="{{ url_for('auth.logout') }}" class="inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="link">Log out</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
  <dialog id="share-dialog"></dialog>
</body>
</html>
