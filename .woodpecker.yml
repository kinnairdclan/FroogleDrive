steps:
  - name: test
    image: python:3.13-slim
    commands:
      - pip install --no-cache-dir -r requirements-dev.txt
      - coverage run -m pytest -q
      - coverage report --fail-under=100

  - name: build
    image: plugins/docker
    # Production pulls :latest, so only code on master may publish it. Cron and
    # manual runs (e.g. scheduled rebuilds for base-image updates) count too.
    when:
      - event: [push, cron, manual]
        branch: master
    settings:
      repo: kinnairdclan/froogledrive
      tags:
        - latest
      username:
        from_secret: dockerhub_username
      password:
        from_secret: dockerhub_access_token
